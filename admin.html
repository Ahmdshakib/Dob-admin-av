<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOB98 Admin Panel</title><style>body{margin:0;background:#030b1b;color:#f5f8ff;font:15px system-ui;padding:16px}.wrap{max-width:1100px;margin:auto}.card{background:#06162e;border:1px solid #124c86;border-radius:12px;padding:18px;margin:14px 0;overflow:auto}input,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #124c86}input{background:#020816;color:white}button{background:#ffc21b;color:#111;font-weight:700;cursor:pointer;margin:2px}.reject{background:#71233a;color:#fff}table{width:100%;border-collapse:collapse;min-width:650px}td,th{text-align:left;padding:10px;border-bottom:1px solid #124c86;overflow-wrap:anywhere}.muted{color:#9bb2d4}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{background:#0a2343;color:#fff}.tabs button.active{background:#ffc21b;color:#111}.status{font-weight:800}.pending{color:#ffdc3c}.approved{color:#4ce0ac}.rejected{color:#ff9eae}</style></head><body><main class="wrap"><h1>DOB98 Admin Panel</h1><p class="muted">Separate admin page · browser-local demo. Keep index.html and this file on the same website origin for shared localStorage.</p><section class="card" id="login"><h2>Admin Login</h2><form id="form"><label>Admin password <input id="pw" type="password" required></label> <button>Login</button><p id="msg"></p></form></section><section id="panel" hidden><section class="card"><button id="logout">Logout</button><div class="tabs"><button data-tab="deposits" class="active">Deposit Requests</button><button data-tab="withdrawals">Withdraw Requests</button><button data-tab="users">Users & Wallets</button></div><p class="muted">Approve a deposit only after checking the payment manually. Approval adds the requested amount to the demo wallet.</p></section><section class="card" id="content"></section></section></main><script>const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'৳ '+(Number(n)||0).toFixed(2);const users=()=>{try{return JSON.parse(localStorage.getItem('dob98_users')||'[]')}catch{return []}};const reqs=()=>{try{return JSON.parse(localStorage.getItem('dob98_requests')||'[]')}catch{return []}};const saveReqs=a=>localStorage.setItem('dob98_requests',JSON.stringify(a));function historyUpdate(r,status){const key='dob98_'+r.type+'_history_'+r.username;let a=[];try{a=JSON.parse(localStorage.getItem(key)||'[]')}catch{}a=a.map(x=>x.id===r.id?{...x,status}:x);localStorage.setItem(key,JSON.stringify(a))}let tab='deposits';function render(){if(tab==='users'){let us=users();$('#content').innerHTML='<h2>Users & Wallets</h2>'+(us.length?'<table><thead><tr><th>Username</th><th>Gmail</th><th>Created</th><th>Wallet</th></tr></thead><tbody>'+us.map(u=>'<tr><td>'+safe(u.username)+'</td><td>'+safe(u.email)+'</td><td>'+safe(u.createdAt||'')+'</td><td>'+money(localStorage.getItem('dob98_wallet_'+u.username)||0)+'</td></tr>').join('')+'</tbody></table>':'No users registered in this browser.');return}let type=tab==='deposits'?'deposit':'withdraw',rs=reqs().filter(r=>r.type===type).slice().reverse();$('#content').innerHTML='<h2>'+(type==='deposit'?'Deposit Requests':'Withdraw Requests')+'</h2>'+(rs.length?'<table><thead><tr><th>ID</th><th>User</th><th>Amount</th><th>Method</th><th>Transaction / Wallet</th><th>Status</th><th>Action</th></tr></thead><tbody>'+rs.map(r=>'<tr><td>'+safe(r.id)+'</td><td>'+safe(r.username)+'</td><td>'+money(r.amount)+'</td><td>'+safe(r.method||'')+'</td><td>'+safe(r.trx||r.wallet||'')+'</td><td class="status '+safe(r.status)+'">'+safe(r.status)+'</td><td>'+(r.status==='pending'?'<button data-action="approve" data-id="'+safe(r.id)+'">Approve</button><button class="reject" data-action="reject" data-id="'+safe(r.id)+'">Reject</button>':'—')+'</td></tr>').join('')+'</tbody></table>':'No requests yet.')}$$('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;$$('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});$('#content').onclick=e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=reqs(),r=a.find(x=>x.id===b.dataset.id);if(!r||r.status!=='pending')return;if(b.dataset.action==='reject')r.status='rejected';else if(r.type==='deposit'){let bal=Number(localStorage.getItem('dob98_wallet_'+r.username)||0);localStorage.setItem('dob98_wallet_'+r.username,String(bal+Number(r.amount||0)));const tk='dob98_turnover_target_'+r.username;localStorage.setItem(tk,String(Number(localStorage.getItem(tk)||0)+Number(r.amount||0)*3));r.status='approved'}else{let bal=Number(localStorage.getItem('dob98_wallet_'+r.username)||0);if(bal<Number(r.amount||0)){alert('Insufficient wallet balance; withdrawal not approved.');return}localStorage.setItem('dob98_wallet_'+r.username,String(bal-Number(r.amount||0)));r.status='approved'}r.reviewedAt=new Date().toISOString();saveReqs(a);historyUpdate(r,r.status);render()};$('#form').onsubmit=e=>{e.preventDefault();if($('#pw').value!=='sha4488kib'){$('#msg').textContent='Wrong password';return}sessionStorage.setItem('dob98_admin_local_ok','1');$('#login').hidden=true;$('#panel').hidden=false;render()};$('#logout').onclick=()=>{sessionStorage.removeItem('dob98_admin_local_ok');location.reload()};window.addEventListener('storage',render);if(sessionStorage.getItem('dob98_admin_local_ok')==='1'){$('#login').hidden=true;$('#panel').hidden=false;render()}</script></body></html>
